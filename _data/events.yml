- title: "Promising Future with Java 17, OpenJDK, and the Cloud"
  date: "2021-11-16"
  time: "17:15"
  location: "Foo Café"
  host: "Ivar Grimstad"
  host_linkedin: "ivargrimstad"
  description: >
    Java is still consistently rated in the top three most popular programming languages in use. 
    The reason for this popularity extends beyond the syntax of the language to the power of the Java Virtual Machine (JVM). 
    With its ability to handle internet-scale workloads, the JVM delivers the performance required for mission-critical enterprise applications. 
    In this session, we’ll explore Java as it is in 2021. JDK 17 has just been released, the ninth (yes, ninth) release in four years. 
    As a long-term support (LTS) release, this is one that many users will choose to use in production. 
    We’ll review the significant new features developers will now be able to exploit as they develop their next applications. 
    We’ve also seen a proliferation in the number of distributions of OpenJDK. 
    We’ll talk about the factors to consider when choosing distribution and how to ensure you keep your Java runtimes as stable and secure as possible. 
    We’ll finish with a look at how Java fits in the cloud and some of the performance issues to consider when moving to a microservices architecture. 
    We’ll explain how you can lower your cloud infrastructure costs and reduce latency without changing a line of code. At the end of this talk, you’ll be all ready to use modern Java.
