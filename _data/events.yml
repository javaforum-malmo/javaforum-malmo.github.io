- title: "JVM in the Age of AI"
  date: "2025-05-05"
  time: "17:15"
  location: "Foo Café"
  host: "Ivar Grimstad"
  host_linkedin: "ivargrimstad"
  description: >
    Are you tired of all the hype around yet another LLM-as-a-Service? 
    That's why I want to talk about something more interesting than just another tool for prompt engineers. 
    While the entire industry is discussing it, my goal is to explain what needs to happen within the virtual machine for the JVM to become a good platform for Machine Learning and AI. 
    We will discuss hardware and the challenges its evolution poses for the JVM, projects like Valhalla and Babylon, as well as standardization efforts like the JSR381 Visual Recognition API. 
    We will also look at initiatives like TornadoVM. This will be an overall birds-eye view to understand how the JVM can meet the demands of contemporary artificial intelligence and machine learning.  
